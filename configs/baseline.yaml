experiment:
  name: baseline
  seed: 42
  output_dir: results

data:
  dataset: musdb18hq
  root: data/musdb18hq
  sample_rate: 44100
  audio_channels: 2        # stereo
  segment_seconds: 4.0
  sources:
    - vocals
    - drums
    - bass
    - other
  batch_size: 4
  num_workers: 2

model:
  type: conv_tasnet
  num_sources: 4
  audio_channels: 2
  encoder_channels: 512
  bottleneck_channels: 128
  hidden_channels: 512
  skip_channels: 128
  num_blocks: 8
  num_repeats: 3
  kernel_size: 3
  encoder_kernel_size: 16
  encoder_stride: 8
  causal: false
  dsc_layers: 0            # baseline: no DSC layers

training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0
  loss: si_sdr             # or pit_si_sdr for permutation-invariant
  grad_clip_norm: 5.0
  device: auto
  checkpoint_dir: checkpoints/baseline

evaluation:
  chunk_size: 65536        # samples per overlap-add chunk (~1.5 s at 44100 Hz)
  hop_size: 32768
  metrics:
    - si_sdr
    - sdr
    - sir
    - sar
  save_csv: results/baseline_metrics.csv
