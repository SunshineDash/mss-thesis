data:
  audio_channels: 2
  batch_size: 2
  dataset: musdb18hq
  num_workers: 2
  root: data/musdb18hq
  sample_rate: 44100
  segment_seconds: 4.0
  sources:
  - vocals
  - drums
  - bass
  - other
evaluation:
  chunk_size: 65536
  hop_size: 32768
  metrics:
  - si_sdr
  - sdr
  - sir
  - sar
  save_csv: results/baseline_metrics.csv
experiment:
  name: baseline
  output_dir: results
  seed: 42
model:
  audio_channels: 2
  bottleneck_channels: 128
  causal: false
  dsc_layers: 0
  encoder_channels: 512
  encoder_kernel_size: 16
  encoder_stride: 8
  hidden_channels: 512
  kernel_size: 3
  num_blocks: 8
  num_repeats: 3
  num_sources: 4
  skip_channels: 128
  type: conv_tasnet
training:
  checkpoint_dir: checkpoints/baseline
  device: auto
  epochs: 100
  grad_clip_norm: 5.0
  learning_rate: 0.001
  loss: pit_si_sdr
  weight_decay: 0.0
